name: Testing workspace and document export checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "security/**"

jobs:
  backend-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend runtime dependencies
        run: python -m pip install fastapi "pydantic[email]" pydantic-settings python-dotenv ollama openai langgraph reportlab python-pptx
      - name: Install pytest for Blueprint Quality Lab checks
        run: python -m pip install pytest
      - name: Compile backend and deterministic tests
        working-directory: backend
        run: python -m compileall -q app test_auth_security.py test_auth_routes.py test_testing_workspace.py test_testing_routes.py test_project_copilot.py test_copilot_routes.py test_code_generator.py test_code_generation_routes.py test_quality_lab.py test_document_export_formats.py test_llm_provider_config.py test_llm_client_providers.py test_workflow_graph.py
      - name: Test LLM provider configuration and adapters
        working-directory: backend
        run: python -m pytest -q test_llm_provider_config.py test_llm_client_providers.py
      - name: Test LangGraph orchestration
        working-directory: backend
        run: python -m pytest -q test_workflow_graph.py
      - name: Test Blueprint Quality Lab
        working-directory: backend
        run: python -m pytest -q test_quality_lab.py
      - name: Test authentication and project authorization
        working-directory: backend
        run: python test_auth_security.py
      - name: Test authenticated project routes
        working-directory: backend
        run: python test_auth_routes.py
      - name: Test PDF, PowerPoint, and Markdown document formats
        working-directory: backend
        run: python -m pytest -q test_document_export_formats.py
      - name: Test test-suite generation, storage and documents
        working-directory: backend
        run: python test_testing_workspace.py
      - name: Test testing workspace and document download routes
        working-directory: backend
        run: python test_testing_routes.py
      - name: Test Copilot grounding and private conversations
        working-directory: backend
        run: python test_project_copilot.py
      - name: Test Copilot HTTP routes and roles
        working-directory: backend
        run: python test_copilot_routes.py
      - name: Test code-bundle safety and versioning
        working-directory: backend
        run: python test_code_generator.py
      - name: Test code-generation API and ZIP download
        working-directory: backend
        run: python test_code_generation_routes.py
      - name: Import FastAPI application
        working-directory: backend
        run: python -c "from app.main import app; print(len(app.routes))"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
