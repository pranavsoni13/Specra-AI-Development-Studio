name: Specra deterministic checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "refinement/**"
      - "security/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies needed by deterministic tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi pydantic pydantic-settings python-dotenv ollama openai langgraph pytest

      - name: Validate provider configuration and response parsing
        run: python -m pytest -q backend/test_llm_providers.py

      - name: Validate LangGraph orchestration
        run: python -m pytest -q backend/test_workflow_graph.py

      - name: Validate requirement traceability and artifact contracts
        run: python -m pytest -q backend/test_semantic_integrity.py backend/test_refinement_flow.py
