name: Auth and role-based access smoke tests

on:
  push:
    branches:
      - "security/**"
  pull_request:
    branches:
      - main

jobs:
  backend-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend runtime dependencies
        run: python -m pip install fastapi "pydantic[email]" pydantic-settings python-dotenv ollama openai langgraph
      - name: Compile backend Python files
        working-directory: backend
        run: python -m compileall -q app test_auth_security.py
      - name: Test password, session and project-role security
        working-directory: backend
        run: python test_auth_security.py
      - name: Import FastAPI application
        working-directory: backend
        run: python -c "from app.main import app; print(f'Specra routes loaded: {len(app.routes)}')"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
