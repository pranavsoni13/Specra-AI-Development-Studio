name: Provider configuration smoke tests

on:
  push:
    branches:
      - "refinement/**"
  pull_request:
    branches:
      - main

jobs:
  provider-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight backend test dependencies
        run: python -m pip install pydantic ollama openai
      - name: Compile backend Python files
        working-directory: backend
        run: python -m compileall -q app test_llm_provider_config.py test_llm_client_providers.py
      - name: Test provider-specific model selection
        working-directory: backend
        run: python test_llm_provider_config.py
      - name: Test mocked provider clients
        working-directory: backend
        run: python test_llm_client_providers.py
