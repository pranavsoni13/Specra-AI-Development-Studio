services:
  - type: web
    name: specra-api-pranavsoni13
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AUTH_BOOTSTRAP_TOKEN
        sync: false
      # Set this in the Render dashboard to a durable PostgreSQL connection URI.
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_PERSISTENT_DATABASE
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ALLOW_PUBLIC_SIGNUP
        value: "true"
      # Production LLM provider. Keep the API key as a secret in Render.
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_APP_NAME
        value: SPECRA
      - key: OPENROUTER_SITE_URL
        value: https://specra-ai-development-studio.vercel.app
      - key: OPENROUTER_REQUIREMENT_ANALYST_MODEL
        value: openai/gpt-4o
      - key: OPENROUTER_PROJECT_PLANNER_MODEL
        value: openai/gpt-4o
      - key: OPENROUTER_SOFTWARE_ARCHITECT_MODEL
        value: openai/gpt-4o
      - key: OPENROUTER_TECHNICAL_REVIEWER_MODEL
        value: openai/gpt-4o
      - key: OPENROUTER_CODE_GENERATION_MODEL
        value: openai/gpt-4o
      # Optional Ollama credentials remain available for local/development use.
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
