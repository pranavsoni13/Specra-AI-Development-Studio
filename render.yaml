services:
  - type: web
    name: specra-api-pranavsoni13
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: REQUIREMENT_ANALYST_MODEL
        value: gpt-oss:20b-cloud
      - key: PROJECT_PLANNER_MODEL
        value: gpt-oss:20b-cloud
      - key: SOFTWARE_ARCHITECT_MODEL
        value: gpt-oss:20b-cloud
      - key: TECHNICAL_REVIEWER_MODEL
        value: gpt-oss:20b-cloud
